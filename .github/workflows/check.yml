name: Check Lucky PH

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check frontend files
        run: |
          test -f frontend/index.html
          test -f frontend/games.html
          test -f frontend/css/style.css
          test -f frontend/js/app.js
          test -f frontend/js/games.js

      - name: Check backend files
        run: |
          test -f backend/package.json
          test -f backend/server.js

      - name: Validate JavaScript syntax
        run: |
          node --check frontend/js/app.js
          node --check frontend/js/games.js
          node --check backend/server.js

      - name: Check complete
        run: echo "Lucky PH project checks passed!"
